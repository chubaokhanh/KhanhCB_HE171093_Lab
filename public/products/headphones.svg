<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)" rx="16" />
  <circle cx="200" cy="150" r="110" fill="#38bdf8" opacity="0.06" />
  <g filter="url(#glow2)">
    <!-- Headband -->
    <path d="M 120 160 A 85 95 0 0 1 280 160" fill="none" stroke="url(#silver)" stroke-width="14" stroke-linecap="round" />
    <path d="M 135 130 A 70 70 0 0 1 265 130" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <!-- Left Ear Cup -->
    <rect x="98" y="150" width="34" height="65" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <rect x="114" y="155" width="12" height="55" rx="6" fill="#334155" />
    <!-- Right Ear Cup -->
    <rect x="268" y="150" width="34" height="65" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <rect x="274" y="155" width="12" height="55" rx="6" fill="#334155" />
  </g>
</svg>
