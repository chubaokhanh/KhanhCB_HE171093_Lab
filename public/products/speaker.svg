<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg7)" rx="16" />
  <circle cx="200" cy="150" r="110" fill="#0284c7" opacity="0.06" />
  <g filter="url(#glow7)" transform="translate(80, 80)">
    <!-- Speaker Body -->
    <rect x="0" y="20" width="240" height="100" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Speaker Grille Pattern -->
    <g fill="#0284c7" opacity="0.6">
      <circle cx="50" cy="70" r="3" /><circle cx="70" cy="70" r="3" /><circle cx="90" cy="70" r="3" />
      <circle cx="110" cy="70" r="3" /><circle cx="130" cy="70" r="3" /><circle cx="150" cy="70" r="3" />
      <circle cx="170" cy="70" r="3" /><circle cx="190" cy="70" r="3" />
      <circle cx="60" cy="55" r="3" /><circle cx="80" cy="55" r="3" /><circle cx="100" cy="55" r="3" />
      <circle cx="120" cy="55" r="3" /><circle cx="140" cy="55" r="3" /><circle cx="160" cy="55" r="3" />
      <circle cx="180" cy="55" r="3" />
      <circle cx="60" cy="85" r="3" /><circle cx="80" cy="85" r="3" /><circle cx="100" cy="85" r="3" />
      <circle cx="120" cy="85" r="3" /><circle cx="140" cy="85" r="3" /><circle cx="160" cy="85" r="3" />
      <circle cx="180" cy="85" r="3" />
    </g>
    <!-- Strap -->
    <path d="M 235 70 C 265 70, 265 50, 235 50" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
    <!-- Top Buttons -->
    <rect x="70" y="14" width="16" height="6" rx="2" fill="#475569" />
    <rect x="100" y="14" width="16" height="6" rx="2" fill="#475569" />
    <rect x="130" y="14" width="16" height="6" rx="2" fill="#38bdf8" />
    <rect x="160" y="14" width="16" height="6" rx="2" fill="#475569" />
  </g>
</svg>
