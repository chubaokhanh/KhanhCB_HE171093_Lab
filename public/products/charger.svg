<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#f43f5e" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg6)" rx="16" />
  <circle cx="200" cy="150" r="110" fill="#f43f5e" opacity="0.06" />
  <g filter="url(#glow6)" transform="translate(100, 60)">
    <!-- Base Plate -->
    <ellipse cx="100" cy="165" rx="85" ry="25" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Stand Pillar -->
    <path d="M 95 160 L 95 80 Q 95 60 115 50" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
    <!-- MagSafe Ring Stand -->
    <circle cx="125" cy="55" r="38" fill="#0f172a" stroke="#f43f5e" stroke-width="4" />
    <circle cx="125" cy="55" r="28" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10 6" />
    <!-- Charging Icon -->
    <polygon points="127,42 118,56 126,56 123,68 132,54 125,54" fill="#fbbf24" />
    <!-- AirPods Pad -->
    <ellipse cx="60" cy="160" rx="24" ry="12" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <circle cx="60" cy="160" r="3" fill="#10b981" />
  </g>
</svg>
