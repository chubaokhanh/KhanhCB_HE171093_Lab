<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)" rx="16" />
  <circle cx="200" cy="150" r="110" fill="#10b981" opacity="0.06" />
  <g filter="url(#glow3)" transform="translate(145, 45)">
    <!-- Straps -->
    <path d="M 25 0 L 85 0 L 80 50 L 30 50 Z" fill="#3f3f46" rx="4" />
    <path d="M 30 160 L 80 160 L 85 210 L 25 210 Z" fill="#3f3f46" rx="4" />
    <!-- Watch Case -->
    <rect x="10" y="45" width="90" height="120" rx="28" fill="#18181b" stroke="#52525b" stroke-width="3" />
    <rect x="18" y="53" width="74" height="104" rx="20" fill="url(#screen)" />
    <!-- Crown -->
    <rect x="100" y="70" width="6" height="20" rx="3" fill="#71717a" />
    <!-- Screen Interface -->
    <circle cx="55" cy="105" r="28" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="120 40" stroke-linecap="round" />
    <circle cx="55" cy="105" r="20" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="80 30" stroke-linecap="round" />
    <text x="55" y="110" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">10:42</text>
  </g>
</svg>
