<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg5)" rx="16" />
  <circle cx="200" cy="140" r="110" fill="#a855f7" opacity="0.06" />
  <g filter="url(#glow5)" transform="translate(60, 45)">
    <!-- Stand Base -->
    <rect x="95" y="195" width="90" height="12" rx="6" fill="#475569" />
    <!-- Stand Arm -->
    <rect x="132" y="155" width="16" height="45" rx="3" fill="#334155" />
    <!-- Monitor Bezel -->
    <rect x="10" y="10" width="260" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Screen -->
    <rect x="16" y="16" width="248" height="138" rx="4" fill="url(#screenDisplay)" />
    <!-- Screen Artwork/Window -->
    <rect x="30" y="30" width="100" height="60" rx="6" fill="rgba(255,255,255,0.2)" />
    <circle cx="42" cy="40" r="3" fill="#ffffff" />
    <circle cx="52" cy="40" r="3" fill="#ffffff" />
    <circle cx="62" cy="40" r="3" fill="#ffffff" />
    <path d="M 40 80 Q 70 50 100 70 T 160 55" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  </g>
</svg>
